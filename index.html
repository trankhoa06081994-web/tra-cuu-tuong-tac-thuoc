<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Tra Cứu Tương Tác Thuốc</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      min-height: 350px;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      color: #1a73e8;
      font-size: 22px;
      margin-bottom: 6px;
    }
    .header p {
      color: #5f6368;
      font-size: 14px;
      margin: 0;
    }
    .search-box-wrapper {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
    }
    .search-btn {
      padding: 0 24px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .search-btn:hover {
      background-color: #1557b0;
    }
  </style>

  <!-- 1. Widget JavaScript bundle chính thức từ Google -->
  <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=en_US"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>AI TRA CỨU TƯƠNG TÁC THUỐC</h1>
      <p>Bệnh viện Đa khoa Khu vực Long Châu</p>
    </div>

    <!-- Khung nhập từ khóa & Nút Tra cứu -->
    <div class="search-box-wrapper">
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Nhập tên thuốc tra cứu (Ví dụ: Acid tranexamic và Ethinylestradiol)...">
      <button id="searchWidgetTrigger" class="search-btn" type="button">Tra cứu</button>
    </div>

    <!-- 2. Search widget element kết nối với Google Vertex AI -->
    <gen-search-widget
      id="vertexWidget"
      configId="2f25250b-1cd6-4f27-8be4-d41d9d5cbee5"
      triggerId="searchWidgetTrigger">
    </gen-search-widget>
  </div>

  <!-- 3. Đoạn mã xử lý kết nối dữ liệu & phím Enter -->
  <script>
    const inputEl = document.getElementById('searchInput');
    const triggerBtn = document.getElementById('searchWidgetTrigger');
    const widgetEl = document.getElementById('vertexWidget');

    // Hàm đồng bộ nội dung input sang Widget và kích hoạt mở cửa sổ trả lời
    function handleSearch() {
      const query = inputEl.value.trim();
      if (query) {
        widgetEl.setAttribute('search-query', query);
      }
    }

    // Bắt sự kiện khi nhấn Enter trong ô nhập
    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        handleSearch();
        triggerBtn.click(); // Kích hoạt sự kiện click trên nút bấm đã liên kết với triggerId
      }
    });

    // Bắt sự kiện khi click trực tiếp vào nút Tra cứu
    triggerBtn.addEventListener('click', function() {
      handleSearch();
    });
  </script>

</body>
</html>
