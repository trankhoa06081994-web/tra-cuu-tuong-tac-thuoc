<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ lý AI Tra Cứu Tương Tác Thuốc</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      min-height: 350px;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      color: #1a73e8;
      font-size: 22px;
      margin-bottom: 6px;
    }
    .header p {
      color: #5f6368;
      font-size: 14px;
      margin: 0;
    }
    .custom-search {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .custom-search input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    .custom-search button {
      padding: 0 24px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .custom-search button:hover {
      background-color: #1557b0;
    }
  </style>

  <!-- Thư viện Vertex AI Builder -->
  <script src="https://cloud.google.com/ai-builder/web/widget.js"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>AI TRA CỨU TƯƠNG TÁC THUỐC</h1>
      <p>Bệnh viện Đa khoa Khu vực Long Châu</p>
    </div>

    <!-- Ô tìm kiếm giao diện thủ công -->
    <div class="custom-search">
      <input type="text" id="searchInput" placeholder="Nhập tên thuốc tra cứu (Ví dụ: Acid tranexamic và Ethinylestradiol)...">
      <button id="searchBtn" type="button">Tra cứu</button>
    </div>

    <!-- Widget ẩn để hứng lệnh tìm kiếm -->
    <gen-search-widget
      id="vertexWidget"
      config-id="2f25250b-1cd6-4f27-8be4-d41d9d5cbee5"
      trigger-element-id="searchBtn">
    </gen-search-widget>
  </div>

  <script>
    const inputEl = document.getElementById('searchInput');
    const btnEl = document.getElementById('searchBtn');

    // Bắt sự kiện Enter trên ô input để kích hoạt nút Tra cứu
    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        btnEl.click();
      }
    });
  </script>

</body>
</html>
