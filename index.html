<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> Tra Cứu Tương Tác Thuốc</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    } 
    .container {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo {
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin-bottom: 16px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.06));
    }
    .header h1 {
      color: #1a73e8;
      font-size: 24px;
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .header p {
      color: #5f6368;
      font-size: 15px;
      font-weight: 500;
      margin: 0;
    }
    .action-wrapper {
      margin-top: 15px;
      display: flex;
      justify-content: center;
    }
    .search-btn {
      padding: 14px 32px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(26,115,232,0.3);
      transition: background-color 0.2s, transform 0.1s;
    }
    .search-btn:hover {
      background-color: #1557b0;
    }
    .search-btn:active {
      transform: scale(0.98);
    }
  </style>

  <!-- Widget JavaScript bundle từ Google -->
  <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=en_US"></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <!-- Thêm Logo Bệnh Viện -->
      <img src="Logo_BV_DK__Long_Chau.png" alt="Logo Bệnh viện Đa khoa Khu vực Long Châu" class="logo">
      <h1> Tra Cứu Tương Tác Thuốc</h1>
      <p>Bệnh viện Đa khoa Khu vực Long Châu</p>
    </div>

    <!-- Nút kích hoạt tra cứu -->
    <div class="action-wrapper">
      <button id="searchWidgetTrigger" class="search-btn" type="button">Tra cứu tương tác thuốc</button>
    </div>

    <!-- Search widget element từ Google Vertex AI -->
    <gen-search-widget
      id="vertexWidget"
      configId="2f25250b-1cd6-4f27-8be4-d41d9d5cbee5"
      triggerId="searchWidgetTrigger">
    </gen-search-widget>
  </div>

</body>
</html>
