<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trợ lý AI Tra Cứu Tương Tác Thuốc</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      min-height: 400px;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    .header h1 {
      color: #1a73e8;
      font-size: 22px;
      margin-bottom: 6px;
    }
    .header p {
      color: #5f6368;
      font-size: 14px;
      margin: 0;
    }
    .search-box-wrapper {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .search-input {
      flex: 1;
      padding: 14px 18px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,0.2);
    }
    .search-btn {
      padding: 0 24px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .search-btn:hover {
      background-color: #1557b0;
    }
  </style>

  <!-- Thư viện Widget Vertex AI Builder -->
  <script src="https://cloud.google.com/ai-builder/web/widget.js" defer></script>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>AI TRA CỨU TƯƠNG TÁC THUỐC</h1>
      <p>Bệnh viện Đa khoa Khu vực Long Châu</p>
    </div>

    <!-- Khai báo Widget AI -->
    <gen-search-widget
      id="myWidget"
      config-id="2f25250b-1cd6-4f27-8be4-d41d9d5cbee5">
    </gen-search-widget>

    <!-- Khung tìm kiếm có nút bấm và bắt sự kiện Enter -->
    <div class="search-box-wrapper">
      <input 
        type="text" 
        id="searchQuery" 
        class="search-input" 
        placeholder="Nhập tên thuốc tra cứu (Ví dụ: Acid tranexamic và Ethinylestradiol)...">
      <button id="searchBtn" class="search-btn">Tra cứu</button>
    </div>
  </div>

  <script>
    function executeSearch() {
      const input = document.getElementById('searchQuery');
      const widget = document.getElementById('myWidget');
      const query = input.value.trim();
      
      if (query && widget) {
        // Gửi truy vấn trực tiếp vào Widget AI của Google
        widget.search(query);
      }
    }

    // Sự kiện khi bấm Enter
    document.getElementById('searchQuery').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        executeSearch();
      }
    });

    // Sự kiện khi bấm nút Tra cứu
    document.getElementById('searchBtn').addEventListener('click', executeSearch);
  </script>

</body>
</html>
